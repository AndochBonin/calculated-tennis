services:
  localstack:
    # Pin CE image; :latest may require LOCALSTACK_AUTH_TOKEN for persistence/pro features.
    image: localstack/localstack:4.4
    ports:
      - "4566:4566"
    environment:
      SERVICES: secretsmanager
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  polymarket:
    build: .
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      AWS_DEFAULT_REGION: eu-west-1
      POLYMARKET_SECRETS_MANAGER_SECRET_ID: polymarket/dev
    env_file:
      - path: .env
        required: false
